name: Nexus Bounty agent discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "cloud-work-engine/bounty_agent.py"
      - "cloud-work-engine/task_triage.py"
      - "cloud-work-engine/model_gateway.py"
      - "cloud-work-engine/tests/test_bounty_agent.py"
      - "cloud-work-engine/tests/test_task_triage.py"
      - ".github/workflows/nexus-bounty-agent.yml"

permissions:
  contents: read

concurrency:
  group: nexus-bounty-agent
  cancel-in-progress: false

jobs:
  discover-and-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOUNTY_AGENT_API_KEY: \${{ secrets.BOUNTY_AGENT_API_KEY }}
      OPENROUTER_API_KEY: \${{ secrets.OPENROUTER_API_KEY }}
      REPORT_DIR: report
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore deduplication state
        uses: actions/cache@v4
        with:
          path: .nexus_state
          key: nexus-bounty-state-\${{ github.run_id }}
          restore-keys: |
            nexus-bounty-state-
      - name: Initialize state directory
        run: mkdir -p .nexus_state report
      - name: Run unit tests
        run: python -m unittest discover -s cloud-work-engine/tests -v
      - name: Discover Bounty tasks (read-only)
        run: python cloud-work-engine/bounty_agent.py
      - name: Triage opportunities (no writes)
        run: python cloud-work-engine/task_triage.py
      - name: Check free model gateway readiness
        run: python cloud-work-engine/model_gateway.py
      - name: Upload reports and state
        uses: actions/upload-artifact@v4
        with:
          name: nexus-bounty-scan-\${{ github.run_id }}
          path: |
            report/
            .nexus_state/
          if-no-files-found: warn
          retention-days: 14
