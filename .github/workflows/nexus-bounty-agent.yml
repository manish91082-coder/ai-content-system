name: Nexus Bounty agent discovery and local coding worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "cloud-work-engine/bounty_agent.py"
      - "cloud-work-engine/event_recovery.py"
      - "cloud-work-engine/work_ledger.py"
      - "cloud-work-engine/bountyboard_public.py"
      - "cloud-work-engine/pact_market.py"
      - "cloud-work-engine/pact_agent.py"
      - "cloud-work-engine/tests/test_pact_agent.py"
      - "cloud-work-engine/tests/test_pact_market.py"
      - "cloud-work-engine/task_triage.py"
      - "cloud-work-engine/bundle_active.py"
      - "cloud-work-engine/local_coder.py"
      - "cloud-work-engine/tests/**"
      - ".github/workflows/nexus-bounty-agent.yml"

permissions:
  contents: read

concurrency:
  group: nexus-bounty-agent
  cancel-in-progress: false

jobs:
  discover-and-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      active_work: ${{ steps.bundle.outputs.active_work }}
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
      PACT_AGENT_API_KEY: ${{ secrets.PACT_AGENT_API_KEY }}
      REPORT_DIR: report
      NEXUS_STATE_DIR: .nexus_state
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore durable Bounty state
        uses: actions/cache@v4
        with:
          path: .nexus_state
          key: nexus-bounty-state-${{ github.run_id }}
          restore-keys: |
            nexus-bounty-state-
      - name: Initialize report and state directories
        run: mkdir -p .nexus_state report
      - name: Run full test suite
        run: python -m unittest discover -s cloud-work-engine/tests -v
      - name: Discover Bounty tasks (read-only)
        run: python cloud-work-engine/bounty_agent.py
      - name: Recover Bounty lifecycle events (read-only)
        run: python cloud-work-engine/event_recovery.py
      - name: Reconcile work and settlement state
        run: python cloud-work-engine/work_ledger.py
      - name: Discover BountyBoard public tasks
        run: python cloud-work-engine/bountyboard_public.py
      - name: Discover PACT AI Market public tasks
        run: python cloud-work-engine/pact_market.py
      - name: Resolve PACT credential from restricted Supabase Vault RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ.get("SUPABASE_URL", "").rstrip("/")
          service_key = os.environ.get("SUPABASE_SERVICE_KEY", "")
          if not base or not service_key:
              print("PACT Vault bridge skipped: Supabase project credentials are not configured.")
              raise SystemExit(0)

          request = Request(
              base + "/rest/v1/rpc/get_nexus_pact_agent_key",
              data=b"{}",
              method="POST",
              headers={
                  "apikey": service_key,
                  "Authorization": "Bearer " + service_key,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )
          try:
              with urlopen(request, timeout=20) as response:
                  key = json.loads(response.read().decode("utf-8"))
          except HTTPError as exc:
              print("PACT Vault bridge failed with HTTP", exc.code)
              raise SystemExit(1)
          except (URLError, TimeoutError, json.JSONDecodeError):
              print("PACT Vault bridge failed: network or response validation error.")
              raise SystemExit(1)

          if key is None or key == "":
              print("No PACT credential found in Vault; authenticated PACT reconciliation remains idle.")
              raise SystemExit(0)
          if not isinstance(key, str) or not key.startswith("sk_pact_"):
              print("PACT Vault bridge rejected an unexpected credential format.")
              raise SystemExit(1)

          print("::add-mask::" + key)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("PACT_AGENT_API_KEY=" + key + "\\n")
          print("PACT credential resolved from Supabase Vault; value masked.")
          PY
      - name: Read PACT agent orders and wallet (read-only)
        run: python cloud-work-engine/pact_agent.py
      - name: Triage opportunities (no writes)
        run: python cloud-work-engine/task_triage.py
      - name: Export already-hired tasks to isolated worker bundle
        id: bundle
        run: python cloud-work-engine/bundle_active.py
      - name: Upload reports and secret-free task bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexus-bounty-task-bundle-${{ github.run_id }}
          path: |
            report/
            .nexus_state/
          if-no-files-found: warn
          retention-days: 14

  local-cpu-coder:
    needs: discover-and-triage
    if: needs.discover-and-triage.outputs.active_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REPORT_DIR: report
      LOCAL_CODER_MODEL: qwen2.5-coder:7b
    steps:
      - name: Checkout code worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download sanitized task bundle
        uses: actions/download-artifact@v4
        with:
          name: nexus-bounty-task-bundle-${{ github.run_id }}
          path: .worker-input
      - name: Isolate sanitized bundle
        run: |
          mkdir -p report
          cp .worker-input/report/active-work-bundle.json report/active-work-bundle.json
          python -c "import json; d=json.load(open('report/active-work-bundle.json')); assert d.get('secrets_included') is False; assert d.get('tasks')"
      - name: Install Ollama local runtime
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start local model server
        run: |
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1
      - name: Download open-weight coder model
        run: ollama pull qwen2.5-coder:7b
      - name: Generate reviewable local code patches
        run: python cloud-work-engine/local_coder.py
      - name: Upload local code patch package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-local-code-patches-${{ github.run_id }}
          path: report/
          if-no-files-found: warn
          retention-days: 30
