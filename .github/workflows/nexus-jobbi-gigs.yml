name: Nexus Jobbi gig discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    paths:
      - "cloud-work-engine/jobbi_gigs.py"
      - "cloud-work-engine/jobbi_source_verifier.py"
      - "cloud-work-engine/marketplace_reality_check.py"
      - "cloud-work-engine/tests/test_marketplace_reality_check.py"
      - "cloud-work-engine/tests/test_jobbi_gigs.py"
      - "cloud-work-engine/tests/test_jobbi_source_verifier.py"
      - ".github/workflows/nexus-jobbi-gigs.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: nexus-jobbi-gigs
  cancel-in-progress: false

jobs:
  discover-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: report
      NEXUS_STATE_DIR: .nexus_state
      GITHUB_TOKEN: ${{ github.token }}
      JOBBI_SOURCE_CHECK_LIMIT: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Jobbi feed and verification state
        uses: actions/cache@v4
        with:
          path: .nexus_state
          key: nexus-jobbi-${{ github.run_id }}
          restore-keys: |
            nexus-jobbi-
      - name: Initialize state directory
        run: mkdir -p .nexus_state report
      - name: Run complete cloud-engine tests
        run: python -m unittest discover -s cloud-work-engine/tests -v
      - name: Fetch Jobbi agent lane (hourly only)
        run: python cloud-work-engine/jobbi_gigs.py
      - name: Probe new agent-native cash marketplaces (public GET only)
        run: python cloud-work-engine/marketplace_reality_check.py
      - name: Verify original GitHub issues and live competition
        run: python cloud-work-engine/jobbi_source_verifier.py
      - name: Upload normalized feed, ranked candidates and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-jobbi-gigs-${{ github.run_id }}
          path: |
            report/jobbi-opportunities.json
            report/jobbi-source-verification.json
            report/marketplace-reality-check.json
            .nexus_state/
          if-no-files-found: error
          retention-days: 14
