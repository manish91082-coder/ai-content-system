name: Phase 1 Reliability Tests

on:
  push:
    branches:
      - revenue-engine/phase-1-reliability
    paths:
      - "src/publish_guard.py"
      - "src/telegram_bot.py"
      - "tests/**"
      - ".github/workflows/phase1_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: python -m pip install requests loguru

      - name: Compile Python source
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
