name: Phase 1 Safety Regression CI

on:
  push:
    branches:
      - revenue-engine/phase-1-safety-fixes
      - revenue-engine/phase-3-editorial-review
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/phase1_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check configured AI provider credentials and model catalogue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python scripts/provider_catalog_check.py
