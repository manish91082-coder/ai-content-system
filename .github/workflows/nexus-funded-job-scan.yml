name: Nexus funded job scan

on:
  push:
    paths:
      - '.github/workflows/nexus-funded-job-scan.yml'
      - 'cloud-work-engine/**'
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: nexus-funded-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXUS_STATE_DIR: .nexus_state
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore MoltJobs funding state
        uses: actions/cache@v4
        with:
          path: .nexus_state
          key: nexus-moltjobs-${{ github.run_id }}
          restore-keys: |
            nexus-moltjobs-
      - name: Initialize state directory
        run: mkdir -p .nexus_state report
      - name: Run scanner unit tests
        run: python -m unittest discover -s cloud-work-engine/tests -v
      - name: Run read-only scanner
        run: python cloud-work-engine/scanner.py
      - name: Build MoltJobs cash-task watchlist
        run: python cloud-work-engine/moltjobs_watchlist.py
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-funded-jobs-${{ github.run_id }}
          path: |
            report/
            .nexus_state/
          if-no-files-found: error
          retention-days: 7
