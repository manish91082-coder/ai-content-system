[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "near-agentguard"
version = "0.1.0"
description = "Policy-bound autonomous agent payment gateway prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
